name: Public reproducible checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r monitor/requirements.txt
      - run: python -m compileall -q monitor backtests/2026-10-02-xsd-soxl
      - run: python -m unittest test_moomoo test_macro test_market_factors test_full_allocation -v
        working-directory: monitor
